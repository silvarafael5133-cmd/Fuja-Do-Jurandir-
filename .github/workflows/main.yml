name: Gerar APK, Windows e Linux

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do jogo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar pasta www e Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Fuja do Jurandir 3D" "com.jurandir.jogo" --web-dir=www
          npx cap add android
          npx cap sync

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Fuja-do-Jurandir-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do jogo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Electron
        run: |
          npm init -y
          npm install electron electron-packager --save-dev
          echo 'const { app, BrowserWindow } = require("electron"); app.whenReady().then(() => { const win = new BrowserWindow({ width: 1024, height: 768, autoHideMenuBar: true }); win.loadFile("index.html"); });' > main.js
          sed -i 's/"main": "index.js"/"main": "main.js"/' package.json

      - name: Gerar Windows e Linux
        run: |
          npx electron-packager . "FujaDoJurandir" --platform=win32 --arch=x64 --out=dist
          npx electron-packager . "FujaDoJurandir" --platform=linux --arch=x64 --out=dist

      - name: Salvar Windows e Linux para download
        uses: actions/upload-artifact@v4
        with:
          name: Fuja-do-Jurandir-Windows-e-Linux
          path: dist/
