name: Gerar APK, Windows e Linux

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do jogo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Converter imagem e Preparar Capacitor
        run: |
          mkdir -p www assets
          cp index.html www/
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert image_bc9584a7.jpg -resize 1024x1024! assets/icon.png
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          npx cap init "Fuja do Jurandir 3D" "com.jurandir.jogo" --web-dir=www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync

      - name: Corrigir conflito Kotlin e Compilar APK
        run: |
          echo 'allprojects { configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" } } }' >> android/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Fuja-do-Jurandir-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código do jogo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Electron e Gerar Windows
        run: |
          npm init -y
          npm install electron electron-packager jimp png-to-ico --save-dev
          node -e "const Jimp = require('jimp'); const fs = require('fs'); const pngToIco = require('png-to-ico'); Jimp.read('image_bc9584a7.jpg').then(img => img.resize(512, 512).writeAsync('icon.png')).then(() => pngToIco('icon.png')).then(buf => fs.writeFileSync('icon.ico', buf));"
          Set-Content -Path "main.js" -Value 'const { app, BrowserWindow } = require("electron"); app.whenReady().then(() => { const win = new BrowserWindow({ width: 1024, height: 768, autoHideMenuBar: true, icon: "icon.png" }); win.loadFile("index.html"); });'
          (Get-Content package.json) -replace '"main": "index.js"', '"main": "main.js"' | Set-Content package.json
          npx electron-packager . "FujaDoJurandir" --platform=win32 --arch=x64 --icon=icon.ico --out=dist

      - name: Salvar Windows para download
        uses: actions/upload-artifact@v4
        with:
          name: Fuja-do-Jurandir-Windows
          path: dist/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do jogo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Electron e Gerar Linux
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert image_bc9584a7.jpg -resize 512x512! icon.png
          npm init -y
          npm install electron electron-packager --save-dev
          echo 'const { app, BrowserWindow } = require("electron"); app.whenReady().then(() => { const win = new BrowserWindow({ width: 1024, height: 768, autoHideMenuBar: true, icon: "icon.png" }); win.loadFile("index.html"); });' > main.js
          sed -i 's/"main": "index.js"/"main": "main.js"/' package.json
          npx electron-packager . "FujaDoJurandir" --platform=linux --arch=x64 --icon=icon.png --out=dist

      - name: Salvar Linux para download
        uses: actions/upload-artifact@v4
        with:
          name: Fuja-do-Jurandir-Linux
          path: dist/
